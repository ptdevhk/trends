default_prompt: Use the resume-ai-scoring-audit workflow. Prefer Trends CLI commands from repo root for restore, hard-reset reingest, AI analysis dispatch, task polling, and export. Join HR cohorts by stable profile resume ID, not Convex resume ID, and report missing resumes, missing AI scores, high-score counts, output paths, and exact commands.
