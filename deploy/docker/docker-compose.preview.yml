# Preview stack for preview.pt-mes.com
#
# Architecture:
#   - Convex (Docker, isolated state vol)  → 127.0.0.1:4210 / 4211
#   - API (systemd on host, port 3002)     → 127.0.0.1:3002
#   - MCP (Docker)                         → 127.0.0.1:3334
#   - Web: static files served by Caddy   → /home/ubuntu/trends-preview/apps/web/dist
#
# Note: API runs as a systemd service (trends-preview-api.service) rather than Docker
# to avoid better-sqlite3 native module cross-platform issues between build host
# (Ubuntu 24.04) and container OS (Debian slim). See deploy/systemd/ for service files.
#
# Ports (no conflict with production 3000/3210/3211/3333):
#   trends.pt-mes.com  uses 3000, 3210, 3211, 3333
#   preview.pt-mes.com uses 3002, 4210, 4211, 3334
#
# Caddy config (already applied to /etc/caddy/Caddyfile):
#   preview.pt-mes.com {
#       tls leotse@datadigitalisation.com
#       encode gzip
#       handle_path /convex/* { reverse_proxy 127.0.0.1:4210 }
#       handle /api/*         { reverse_proxy 127.0.0.1:3002 }
#       handle /mcp/*         { reverse_proxy 127.0.0.1:3334 }
#       handle {
#           root * /home/ubuntu/trends-preview/apps/web/dist
#           try_files {path} /index.html
#           file_server
#       }
#   }
#
# Deploy steps:
#   1. Run setup-preview.sh (copies code from /opt/trends, installs deps, builds API+Web)
#   2. docker compose -f docker-compose.preview.yml up -d
#   3. systemctl start trends-preview-api   (API runs natively)
#   4. systemctl reload caddy

services:
  convex:
    image: node:25-slim
    container_name: trends-preview-convex
    restart: unless-stopped
    # 12GB required when serving prod-restored data (~9k resumes, 1.5 GiB SQLite).
    # History: 2g → OOM on import; 4g → OOM under steady query load (RSS hits 4.0 GiB
    # exactly, see dmesg + queries/2026-05-29-convex-local-backend-memory-oom.md);
    # 8g → OOM-killed at ~8.1 GiB anon-rss during compute reingest bursts (three
    # kills on 2026-08-05 while draining 2,300 stale rows — backend crash-looped,
    # jobs resumed after each restart and re-killed it). 12g gives ~50% margin
    # above the observed ceiling and fits the ~24 GiB preview host.
    mem_limit: 12g
    ports:
      - "127.0.0.1:4210:3210"
      - "127.0.0.1:4211:3211"
    volumes:
      - .:/app:rw
      # Isolated node_modules so the container re-installs its own copy
      - convex-node-modules:/app/node_modules
      # Isolated Convex state dir — prevents export lock pollution from production
      - convex-state:/app/packages/convex/.convex
      - convex-cache:/root/.cache
    working_dir: /app
    environment:
      - HOME=/root
      # tmp on same fs as project to avoid cross-filesystem Convex binary move errors
      - CONVEX_TMPDIR=/root/.cache/tmp
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - CONVEX_LOCAL_BACKEND_STARTUP_TIMEOUT_SECS=120
      # Memory tuning — defaults from get-convex/convex-backend/crates/common/src/knobs.rs.
      # Reclaims ~950 MiB at steady state vs. the 1 GiB shared UDF cache default.
      # Safe at our scale (≤10k docs, low UDF count); revisit if query latency regresses.
      - SHARED_UDF_CACHE_MAX_SIZE=100000000
      - UDF_CACHE_MAX_SIZE=50000000
      # System-op budget relief at preview scale (~9k resumes, ~3k sources):
      # the per-query budget is ~10k system ops and full-table collect()s on
      # restored prod data exceed it. 256 docs held in memory plus capped
      # concurrent query/mutation execution keep queries inside the budget
      # and bound memory (host-verified: 4.2 GiB / 12g, zero restarts).
      - DOCUMENTS_IN_MEMORY=256
      - APPLICATION_MAX_CONCURRENT_QUERIES=8
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=8
      # Match self-hosted/docker/docker-compose.yml override (2 days vs 14 day default).
      - DOCUMENT_RETENTION_DELAY=172800
      # Convex actions call the host BFF for ingest-compute + skills-version.
      # Docker cannot use container-local production-port loopback; UFW also
      # blocks docker-bridge → host preview API port. Public HTTPS is durable.
      # Defaults from deploy/lib-bff-defaults.sh / .env.preview (PREVIEW_PUBLIC_HOST).
      # Also synced into Convex deployment env via sync-preview-convex-env.sh.
      - TRENDS_DEPLOYMENT_ROLE=${TRENDS_DEPLOYMENT_ROLE:-preview}
      - PREVIEW_PUBLIC_HOST=${PREVIEW_PUBLIC_HOST:-preview.pt-mes.com}
      - BFF_API_URL=${BFF_API_URL:-https://${PREVIEW_PUBLIC_HOST:-preview.pt-mes.com}}
    command: ["sh", "/app/start-convex.sh"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3210/version', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 180s

  mcp:
    build:
      # When the compose file is copied to the project root (typical preview deploy
      # pattern), use `context: .`. Keep this comment to remind operators.
      context: .
      dockerfile: deploy/docker/Dockerfile.mcp
    container_name: trends-preview-mcp
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3334:3333"
    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro
    env_file:
      - .env.preview

volumes:
  convex-cache:
  convex-state:
  convex-node-modules:
