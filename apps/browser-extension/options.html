<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Collector Options</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: auto;
        min-width: 420px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .label {
        font-size: 12px;
        color: #bbb;
      }

      .input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        outline: none;
      }

      .input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .row .btn {
        flex: 1;
      }

      .hint {
        font-size: 11px;
        color: #999;
        line-height: 1.4;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #aaa;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #666;
      }

      .dot.connected {
        background: #4caf50;
      }

      .radio-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #ddd;
      }

      .radio-option input {
        accent-color: #667eea;
      }

      .radio-meta {
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚙️ 服务器同步设置</h1>
        <p class="subtitle">输入 Auth Token 即可开始同步</p>
      </header>

      <div class="status-pill">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">未测试</span>
      </div>

      <div class="form">
        <div class="field">
          <div class="label">Auth Token</div>
          <input id="server-token" class="input" type="password" placeholder="RESUME_SUBMIT_TOKEN" />
          <div class="hint">服务端环境变量：`RESUME_SUBMIT_TOKEN`</div>
        </div>

        <div class="field">
          <div class="label">Server URL</div>
          <input id="server-url" class="input" type="url" placeholder="https://trends.pt-mes.com" />
          <div class="hint">默认: trends.pt-mes.com，一般无需修改</div>
        </div>

        <div class="field">
          <div class="label">关键词模式</div>
          <div class="radio-group">
            <label class="radio-option">
              <input id="keyword-mode-concat" type="radio" name="keyword-mode" value="concat" />
              <span>连写 <span class="radio-meta">— CNC车床销售STAR (推荐)</span></span>
            </label>
            <label class="radio-option">
              <input id="keyword-mode-spaced" type="radio" name="keyword-mode" value="spaced" />
              <span>空格 <span class="radio-meta">— CNC 车床 销售 STAR</span></span>
            </label>
          </div>
        </div>

        <div class="field">
          <div class="label">默认采集数量</div>
          <input id="collect-limit" class="input" type="number" min="0" step="1" value="0" />
          <div class="hint">0 = 不限制</div>
        </div>

        <div class="field">
          <div class="label">最大翻页数</div>
          <input id="max-pages" class="input" type="number" min="0" step="1" value="0" />
          <div class="hint">0 = 不限制</div>
        </div>

        <div class="field">
          <div class="label">采集字段过滤 (Collection Field Guards)</div>
          <textarea
            id="guard-job5156"
            class="input"
            rows="2"
            placeholder="experience,jobIntention,selfIntro"
          ></textarea>
          <div class="hint">job5156</div>
          <textarea
            id="guard-51job"
            class="input"
            rows="2"
            placeholder=""
          ></textarea>
          <div class="hint">51job</div>
          <textarea
            id="guard-seek"
            class="input"
            rows="2"
            placeholder=""
          ></textarea>
          <div class="hint">seek</div>
          <div class="hint">
            逗号分隔字段名: experience, jobIntention, selfIntro, expectedSalary, workHistory, profileEducation
          </div>
        </div>

        <div class="row">
          <button id="btn-test" class="btn btn-secondary">
            <span class="icon">🔌</span>
            测试连接
          </button>
          <button id="btn-save" class="btn btn-primary">
            <span class="icon">💾</span>
            保存
          </button>
        </div>

        <div id="message" class="status-bar hidden">
          <span id="message-text"></span>
        </div>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
