# Research news-source seed catalog (opt-in/out).
#
# SSOT for groups -> feed ids. Feed ids MUST already exist in config/config.yaml
# rss.feeds (urls live there, never duplicated here). Overlay filters catalog ids only;
# non-catalog feeds (hacker-news, ruanyifeng, mp-connector) keep config.yaml enabled only.
#
# Default-ON / opt-out: defaults.groups = full group list. Empty workspace overlay
# (masterEnabled true) -> every group ON.
version: v1

