name: CLI Release

on:
  push:
    tags:
      - "cli/v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/cli/go.mod

      - name: Resolve release version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/cli/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run CLI tests
        working-directory: packages/cli
        run: go test ./...

      - name: Build binary and archive
        working-directory: packages/cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          BASENAME="trends-cli_${VERSION}_${GOOS}_${GOARCH}"
          BIN_NAME="trends"
          if [[ "${GOOS}" == "windows" ]]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi

          GOFLAGS="-trimpath" go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN_NAME}" .

          if [[ "${GOOS}" == "windows" ]]; then
            ARCHIVE="${BASENAME}.zip"
            (cd dist && zip -q "${ARCHIVE}" "${BIN_NAME}")
          else
            ARCHIVE="${BASENAME}.tar.gz"
            (cd dist && tar -czf "${ARCHIVE}" "${BIN_NAME}")
          fi

          rm -f "dist/${BIN_NAME}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/cli/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
