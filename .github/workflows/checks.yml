name: Checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for deep scan
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Check i18n locale files
        run: make i18n-check

  verify:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Node.js setup (for TypeScript checks/build)
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm install

      - name: Validate resume fixtures
        run: npx tsx scripts/test-resume-fixtures.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blacklist E2E gate
        run: npm --workspace @trends/web run test:e2e:blacklist

      - name: Run agent policy checks
        run: make check-agent-policy

      - name: Verify critical path (seeded mode)
        run: make verify-critical-path MODE=seeded JSON=1 || echo "Advisory verification failed, skipping block"

      - name: Run checks + build validation
        run: make check-build

      - name: Check Convex schema drift
        if: env.CONVEX_DEPLOYMENT
        run: |
          # Ensure tsx is accessible where convex expects it (npm hoisting workaround)
          mkdir -p packages/convex/node_modules/.bin
          ln -sf ../../../node_modules/.bin/tsx packages/convex/node_modules/.bin/tsx
          cd packages/convex
          npx convex codegen --typecheck disable
          cd ../..
          git diff --exit-code packages/convex/convex/_generated/ || {
            echo "::error::Convex generated types are stale. Run 'cd packages/convex && npx convex codegen' and commit the changes."
            exit 1
          }
