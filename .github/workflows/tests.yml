name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/go.mod
          cache-dependency-path: packages/cli/go.sum

      - name: Install dependencies
        run: make install-deps

      - name: Run tests with coverage
        # DIAGNOSTIC RUN: web suite with verbose reporter + threads pool to
        # pinpoint the deterministic mid-suite stall on Ubuntu runners
        # (107/186 files complete, then silence; not reproducible locally).
        # Restore to `make test-coverage` once the cause is fixed.
        run: |
          npm run --workspace @trends/shared build
          cd apps/web && npx vitest run --coverage --reporter=verbose --pool=threads

      - name: Upload coverage to Codecov
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./apps/web/coverage/lcov.info,./coverage/lcov.info
          fail_ci_if_error: false
