[project]
name = "trends"
version = "0.4.23"
description = "Trends - Multi-source data aggregation & AI screening platform"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5,<3.0.0",
    "pytz>=2025.2,<2027.0",
    "PyYAML>=6.0.3,<7.0.0",
    "fastmcp>=3.4.7,<4.0.0",
    "authlib>=1.6.9",
    "cryptography>=46.0.5",
    "python-multipart>=0.0.22",
    "websockets>=16.0,<17.0",
    "feedparser>=6.0.0,<7.0.0",
    "boto3>=1.35.0,<2.0.0",
    "litellm>=1.83.14,<2.0.0",
    "tenacity==9.1.4",
    "opencc-python-reimplemented>=0.1.7,<1.0.0",
    "fastapi>=0.136.1,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "apscheduler>=3.10.0,<4.0.0"
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server", "packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["apps/worker/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
